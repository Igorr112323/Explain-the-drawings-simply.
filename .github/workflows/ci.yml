name: CI

# Every push and every pull request: TypeScript gates plus both Python services.
# Nothing here needs a native SDK, so it finishes in a couple of minutes.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-tests:
    name: Web · typecheck · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (schema + translator + builder + studio)
        run: npm run typecheck

      - name: Vitest (studio, builder, schema)
        run: npm test

      - name: Build packages and the studio bundle
        run: npm run build

      - name: Upload the studio build
        uses: actions/upload-artifact@v4
        with:
          name: studio-web-dist
          path: apps/studio-web/dist
          retention-days: 7

  python-services:
    name: Python · vision-api + cad-api tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install vision-api dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/vision-api/requirements.txt
          # OCR is optional: without it the service still reads vector PDFs and reports `ocr: none`.
          pip install -r services/vision-api/requirements-ocr.txt || echo "OCR недоступен — тесты не требуют его"

      - name: Install cad-api dependencies
        run: |
          pip install -r services/cad-api/requirements.txt
          # STEP is optional as well (cascadio); STL/OBJ/GLB cover the rest.
          pip install -r services/cad-api/requirements-step.txt || echo "STEP-движок недоступен — тесты не требуют его"

      - name: pytest vision-api
        working-directory: services/vision-api
        run: python -m pytest -q

      - name: pytest cad-api
        working-directory: services/cad-api
        run: python -m pytest -q

  # Настоящая проверка Rust-оболочки: в песочнице разработки нет rustc, поэтому компиляция
  # Tauri проверяется здесь. cargo check не собирает установщик, но ловит ошибки кода и конфига.
  rust-tauri-check:
    name: Rust · cargo check (Tauri 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target

      - name: Системные библиотеки Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Пакеты ядра и бандл студии (нужны для generate_context!)
        run: npm ci && npm run build

      - name: cargo check
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo check --all-targets

  config-syntax:
    name: Configs · YAML · JSON · XML · Tauri · Capacitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate every config file the release builds depend on
        run: node scripts/check-native-configs.mjs
