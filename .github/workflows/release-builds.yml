name: Build Windows .exe

# Здесь и только здесь появляется настоящий `.exe`: в песочнице разработки нет Rust.
# Запуск в один клик: Actions → «Build Windows .exe» → Run workflow. По тегу v* файлы ещё и
# прикрепляются к GitHub Release.
#
# Что собирается:
#   1. checks               — тесты, типы, веб-бандл, проверка нативных конфигов (быстро, Linux);
#   2. build-windows-exe    — IKGuide Studio: установщик NSIS + переносимый .exe (Windows);
#   3. build-engine-windows — локальный движок (vision + cad) в виде двух .exe через PyInstaller;
#   4. build-portable-backend — архив с Python-сервисами и скриптом запуска (запасной путь).
#
# Джоб движка помечен `continue-on-error: true`: если PyInstaller на новой версии зависимости
# споткнётся, сам продукт (UI + установщик) всё равно соберётся и выгрузится в Artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для имени файлов (например, 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------- Проверки
  checks:
    name: Тесты, типы, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Типы
        run: npm run typecheck

      - name: Сборка веб-бандла
        run: npm run build

      - name: Конфигурация нативной упаковки
        run: npm run check:native

  # ---------------------------------------------------------------- Windows .exe
  build-windows-exe:
    name: Windows .exe (установщик + portable)
    needs: checks
    runs-on: windows-latest
    # Имя репозитория заканчивается точкой, а Windows не умеет папки с точкой на конце — поэтому
    # штатный checkout в $GITHUB_WORKSPACE падает. Клонируем в короткий путь и работаем в нём.
    defaults:
      run:
        shell: pwsh
        working-directory: C:\ikguide
    steps:
      - name: Checkout в короткий путь
        shell: pwsh
        working-directory: C:\
        run: |
          git clone --quiet "https://github.com/${{ github.repository }}.git" C:\ikguide
          git -C C:\ikguide checkout --quiet "${{ github.sha }}"
          git -C C:\ikguide log --oneline -1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Глоб-движок setup-node понимает только прямые слэши.
          cache-dependency-path: C:/ikguide/package-lock.json

      - name: Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Кэш cargo намеренно не используется: он ожидает checkout в $GITHUB_WORKSPACE, а здесь
      # рабочая папка — C:\ikguide. Надёжность сборки важнее пары минут компиляции.

      - name: Зависимости веб-части
        run: npm ci

      - name: Собрать пакеты и веб-бандл
        run: npm run build

      - name: Поставить Tauri CLI
        run: npm install --prefix apps/desktop-tauri --no-audit --no-fund

      - name: Проверить конфигурацию Tauri
        run: node scripts/check-native-configs.mjs

      - name: Собрать .exe (NSIS + MSI)
        # Вывод дублируется в аннотацию при падении: логи Actions в некоторых средах недоступны,
        # а причина должна быть видна сразу в сводке запуска.
        run: |
          npm --prefix apps/desktop-tauri run build -- --bundles nsis,msi 2>&1 |
            Tee-Object -FilePath C:\ikguide\tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content C:\ikguide\tauri-build.log -Tail 20 | Out-String) -replace "`r?`n", ' | '
            Write-Host "::error title=Сборка Tauri упала::$tail"
            exit 1
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Разложить артефакты
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Переносимый вариант: один .exe, без установки (WebView2 уже есть в Windows 10/11).
          Copy-Item "apps/desktop-tauri/src-tauri/target/release/ikguide-studio.exe" "artifacts/IKGuide-Studio-Portable.exe"
          # Установщик: NSIS собирает «IKGuide Studio_<версия>_x64-setup.exe».
          $nsis = Get-ChildItem "apps/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS-установщик не собрался" }
          Copy-Item $nsis.FullName "artifacts/IKGuide-Studio-Setup.exe"
          # MSI — для доменных машин, где MSI разворачивают групповой политикой.
          $msi = Get-ChildItem "apps/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "artifacts/IKGuide-Studio.msi" }
          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Артефакт ikguide-studio-windows
        uses: actions/upload-artifact@v4
        with:
          name: ikguide-studio-windows
          path: C:\ikguide\artifacts\*
          if-no-files-found: error
          retention-days: 30

      - name: Прикрепить к Release (только по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: C:\ikguide\artifacts\*
          fail_on_unmatched_files: false

  # -------------------------------------------- Локальный движок (два .exe, PyInstaller)
  build-engine-windows:
    name: Движок Python (PyInstaller)
    runs-on: windows-latest
    # Тяжёлая и капризная упаковка не должна блокировать выпуск UI-сборки.
    continue-on-error: true
    # Та же причина, что и у .exe: короткий путь вместо $GITHUB_WORKSPACE с точкой на конце.
    defaults:
      run:
        shell: pwsh
        working-directory: C:\ikguide
    steps:
      - name: Checkout в короткий путь
        shell: pwsh
        working-directory: C:\
        run: |
          git clone --quiet "https://github.com/${{ github.repository }}.git" C:\ikguide
          git -C C:\ikguide checkout --quiet "${{ github.sha }}"

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Зависимости движка + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/vision-api/requirements.txt
          python -m pip install -r services/cad-api/requirements.txt
          python -m pip install pyinstaller

      - name: Собрать ikguide-vision.exe
        working-directory: C:\ikguide\services\vision-api
        run: |
          python -m PyInstaller --noconfirm --onefile --name ikguide-vision `
            --paths . --collect-submodules app `
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            engine_entry.py 2>&1 | Tee-Object -FilePath C:\ikguide\ikguide-vision.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content C:\ikguide\ikguide-vision.log -Tail 20 | Out-String) -replace "`r?`n", ' | '
            Write-Host "::error title=PyInstaller ikguide-vision упал::$tail"
            exit 1
          }

      - name: Собрать ikguide-cad.exe
        working-directory: C:\ikguide\services\cad-api
        run: |
          python -m PyInstaller --noconfirm --onefile --name ikguide-cad `
            --paths . --collect-submodules app `
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            engine_entry.py 2>&1 | Tee-Object -FilePath C:\ikguide\ikguide-cad.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content C:\ikguide\ikguide-cad.log -Tail 20 | Out-String) -replace "`r?`n", ' | '
            Write-Host "::error title=PyInstaller ikguide-cad упал::$tail"
            exit 1
          }

      - name: Сложить движок в папку engine
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/engine | Out-Null
          Copy-Item services/vision-api/dist/ikguide-vision.exe artifacts/engine/
          Copy-Item services/cad-api/dist/ikguide-cad.exe artifacts/engine/
          @'
          IKGuide Studio: локальный движок
          ================================
          Положите папку engine рядом с IKGuide-Studio-Portable.exe (или в папку установки
          установщика) — приложение само запустит оба сервиса в фоне, без окна консоли.
          Порт 8000 — распознавание чертежа, порт 8001 — 3D-модели. Слушают только 127.0.0.1.
          '@ | Set-Content -Encoding UTF8 artifacts/engine/ПРОЧТИ-МЕНЯ.txt
          Get-ChildItem artifacts/engine

      - name: Артефакт ikguide-engine-windows
        uses: actions/upload-artifact@v4
        with:
          name: ikguide-engine-windows
          path: C:\ikguide\artifacts\engine\*
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------- Локальный бэкенд (архив)
  build-portable-backend:
    name: Локальный бэкенд (архив)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать архив с сервисами и скриптом запуска
        run: |
          mkdir -p backend-package
          cp -r services/vision-api services/cad-api backend-package/
          rm -rf backend-package/*/.venv backend-package/*/__pycache__ backend-package/*/.pytest_cache
          mkdir -p backend-package/scripts
          cp scripts/start-backend.bat scripts/start-backend.sh backend-package/scripts/
          cp README.md backend-package/README.md
          cat > backend-package/КАК-ЗАПУСТИТЬ.txt <<'TXT'
          IkGuide: локальный бэкенд
          ========================

          1. Установите Python 3.11 с python.org (обязательно отметьте «Add python.exe to PATH»).
          2. Двойной щелчок по scripts\start-backend.bat — при первом запуске добавьте
             аргумент install: start-backend.bat install
          3. Запустите IkGuide Studio: он сам обратится к сервисам на 127.0.0.1:8000 и :8001.

          Сервисы слушают только этот компьютер: файлы чертежей никуда не отправляются.
          Без интернета работают и распознавание, и 3D, и сборка PDF.
          TXT
          cd backend-package && zip -r ../ikguide-backend.zip . && cd ..
          ls -la ikguide-backend.zip

      - name: Артефакт ikguide-backend
        uses: actions/upload-artifact@v4
        with:
          name: ikguide-backend
          path: ikguide-backend.zip
          if-no-files-found: error
          retention-days: 30

      - name: Прикрепить к Release (только по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ikguide-backend.zip
          fail_on_unmatched_files: false

  # ----------------------------------------------------------------- Сводка
  summary:
    name: Итог
    needs: [checks, build-windows-exe, build-engine-windows, build-portable-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Сводка релиза
        run: |
          {
            echo "## Сборки IkGuide Studio"
            echo ""
            echo "| Что | Статус |"
            echo "| --- | --- |"
            echo "| Тесты, типы, сборка | ${{ needs.checks.result }} |"
            echo "| Windows .exe (установщик + portable) | ${{ needs.build-windows-exe.result }} |"
            echo "| Движок Python (PyInstaller, не блокирует .exe) | ${{ needs.build-engine-windows.result }} |"
            echo "| Локальный бэкенд (архив) | ${{ needs.build-portable-backend.result }} |"
            echo ""
            echo "Готовые файлы — в разделе **Artifacts** этого запуска (и в Release, если запуск по тегу)."
            echo ""
            echo "**Как запустить на чистой Windows:** распакуйте \`ikguide-studio-windows\` и \`ikguide-engine-windows\`,"
            echo "положите папку \`engine\` рядом с \`IKGuide-Studio-Portable.exe\` (или в папку установки) —"
            echo "приложение само поднимет движок без окна консоли."
          } >> "$GITHUB_STEP_SUMMARY"
